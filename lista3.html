<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmAffinity Pro Search</title>
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #141414;
            --bg-surface-hover: #1f1f1f;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #f5c518;
            --accent-hover: #e5b300;
            --danger: #ef4444;
            --glass-bg: rgba(20, 20, 20, 0.75);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        header h1 { margin: 0; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        header h1 span { color: var(--accent); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        .search-panel {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
        
        input {
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--accent); }

        .btn-search {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            height: 48px;
            grid-column: 1 / -1;
        }

        .btn-search:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

        #results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-8px); border-color: var(--accent); }
        .card-img-wrapper { position: relative; width: 100%; padding-top: 150%; background-color: #1a1a1a; }
        .card img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .card-rating-badge {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
            color: var(--accent); padding: 6px 10px; border-radius: 20px;
            font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 4px;
            border: 1px solid rgba(245, 197, 24, 0.3);
        }

        .card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 15px; font-weight: 700; margin: 0 0 8px 0; line-height: 1.4; }
        .card-meta { color: var(--text-secondary); font-size: 13px; margin-bottom: 18px; }
        
        .card-btn {
            margin-top: auto; display: block; text-align: center;
            background-color: var(--bg-base); color: var(--text-primary);
            text-decoration: none; padding: 10px; border-radius: 6px; font-size: 13px;
            font-weight: 600; border: 1px solid var(--border-color); transition: all 0.2s ease;
        }

        .card-btn:hover { background-color: var(--text-primary); color: var(--bg-base); }
        .status-message { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 15px; background-color: var(--bg-surface); border-radius: 12px; border: 1px dashed var(--border-color); }
        .spinner { border: 3px solid rgba(255,255,255,0.08); border-left-color: var(--accent); border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>Film<span>Affinity</span> Pro</h1>
    </header>

    <div class="container">
        <div class="search-panel">
            <form id="api-search-form" class="form-grid">
                
                <div class="form-group" style="grid-column: span 2;">
                    <label>Búsqueda / Palabra Clave</label>
                    <input type="text" id="query" value="Terror" placeholder="Ej: Terror, Batman, Matrix..." required>
                </div>

                <div class="form-group">
                    <label>Año Mínimo</label>
                    <input type="number" id="anio" value="2000" placeholder="Ej: 2010">
                </div>

                <div class="form-group">
                    <label>Nota Mínima</label>
                    <input type="number" id="nota" value="5.0" min="1" max="10" step="0.1" placeholder="Ej: 6.5">
                </div>

                <button type="submit" class="btn-search">Buscar en FilmAffinity</button>
            </form>
        </div>

        <div id="results-container">
            <div class="status-message">Escribe una palabra clave o título y pulsa buscar.</div>
        </div>
    </div>

    <script>
        const API_KEY = "b8b6969556msh88c69e5a64b7115p1b6027jsn97d3eec3b2ad";
        const API_HOST = "filmaffinity-data-api.p.rapidapi.com";

        document.getElementById('api-search-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const busqueda = document.getElementById('query').value.trim();
            const anioBuscado = parseInt(document.getElementById('anio').value) || 0;
            const notaBuscada = parseFloat(document.getElementById('nota').value) || 0;
            
            const container = document.getElementById('results-container');
            
            container.innerHTML = `
                <div class="status-message">
                    <div class="spinner"></div>
                    Buscando "${busqueda}" mediante el endpoint autorizado...
                </div>
            `;

            // Usamos /v1/search en lugar de /v1/discover (incluido en el plan Basic)
            const apiUrl = `https://${API_HOST}/v1/search?query=${encodeURIComponent(busqueda)}&lang=es`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'X-RapidAPI-Key': API_KEY,
                        'X-RapidAPI-Host': API_HOST
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Código ${response.status}: ${errorText || response.statusText}`);
                }

                const data = await response.json();
                const items = Array.isArray(data) ? data : (data.results || data.data || []);

                // Filtro local según el año y la nota exigidos
                const filteredItems = items.filter(item => {
                    const ratingStr = item.rating || item.rate || item.vote_average || "0";
                    const rating = parseFloat(ratingStr.toString().replace(',', '.'));
                    const year = parseInt(item.year || item.release_year || 0);
                    
                    let matchRating = (notaBuscada === 0) ? true : (rating >= notaBuscada);
                    let matchYear = (anioBuscado === 0) ? true : (year >= anioBuscado);

                    return matchRating && matchYear;
                });

                renderCards(filteredItems);

            } catch (error) {
                console.error("Fallo de API:", error);
                container.innerHTML = `
                    <div class="status-message" style="color: var(--danger); border-color: var(--danger);">
                        ⚠️ Error de consulta: ${error.message}
                    </div>
                `;
            }
        });

        function renderCards(items) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="status-message">
                        Se recibieron datos pero ningún título cumple con el año o nota seleccionados.<br>
                        Prueba a bajar la nota o cambiar la palabra clave.
                    </div>
                `;
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name || 'Sin título';
                const year = item.year || item.release_year || '----';
                
                const rawRating = item.rating || item.rate || 'N/A';
                const formattedRating = (typeof rawRating === 'number') ? rawRating.toFixed(1) : rawRating;

                const poster = item.poster || item.poster_url || item.image || 'https://via.placeholder.com/400x600/1a1a1a/ffffff?text=Sin+Poster';
                
                let faUrl = item.url || item.link;
                if (!faUrl && item.id) {
                    faUrl = `https://www.filmaffinity.com/es/film${item.id}.html`;
                } else if (!faUrl) {
                    faUrl = `https://www.filmaffinity.com/es/search.php?stext=${encodeURIComponent(title)}`;
                }

                const cardHtml = `
                    <div class="card">
                        <div class="card-img-wrapper">
                            <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600/1a1a1a/ffffff?text=Sin+Poster'">
                            <div class="card-rating-badge">★ ${formattedRating}</div>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title" title="${title}">${title}</h3>
                            <div class="card-meta">Año: ${year}</div>
                            <a href="${faUrl}" target="_blank" class="card-btn">Ver Ficha Completa</a>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }
    </script>
</body>
</html>
